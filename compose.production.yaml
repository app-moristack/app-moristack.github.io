name: moristack
services:
  app:
    image: moristack:${IMAGE_TAG:-production}
    build: .
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:uid=101,gid=101,mode=1777']
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    expose: ['8080']
    networks:
      frontend:
        aliases: [moristack-app]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/up']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
networks:
  frontend:
    external: true
    name: moristack_frontend
