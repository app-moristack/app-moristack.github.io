name: Build and deploy production
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-moristack
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://moristack.duckdns.org
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and validate production image
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "moristack:$GITHUB_SHA" .
      - name: Configure restricted SSH access
        env:
          DEPLOY_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          HOST_KEY: ${{ secrets.PRODUCTION_SSH_HOST_KEY }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/moristack_key"
          printf '%s\n' "$HOST_KEY" > "$HOME/.ssh/known_hosts"
      - name: Deploy image and verify HTTPS
        run: |
          set -euo pipefail
          docker save "moristack:$GITHUB_SHA" | gzip -1 | ssh \
            -i "$HOME/.ssh/moristack_key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=120 \
            github-moristack@62.83.10.197 "deploy $GITHUB_SHA"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://moristack.duckdns.org/up > /dev/null
      - name: Remove temporary SSH key
        if: always()
        run: rm -f "$HOME/.ssh/moristack_key"
